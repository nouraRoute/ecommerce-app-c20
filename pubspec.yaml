name: ecommerce_app
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.3.4

dependencies:
  cached_network_image:
  carousel_slider_plus:
  flutter:
    sdk: flutter
  flutter_screenutil:
  flutter_slidable:
  auto_size_text:
  colornames:
  flutter_svg:
  flutter_native_splash:
  readmore:
  smooth_page_indicator:
  retrofit: ^4.10.0
  logger: ^2.8.0
  json_annotation: ^4.12.0
  dio: ^5.11.1
  injectable: ^3.0.0
  get_it: ^9.3.0
  flutter_bloc: ^9.1.1
  lottie: ^3.7.0
  equatable: ^3.0.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints:
  retrofit_generator: ^10.3.2
  build_runner: ^2.15.1
  json_serializable: ^6.14.1
  injectable_generator: ^3.0.2

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/svg_images/
    - assets/lotty/



  fonts:
     - family: Poppins
       fonts:
         - asset: assets/fonts/Poppins-.ttf



